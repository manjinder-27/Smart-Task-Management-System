{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card">
        <h2>Edit Task</h2>
        <form id="editTaskForm">
            <!-- Hidden input to store ID -->
            <input type="hidden" id="edit_task_id" value="{{ task_id }}">
            
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="edit_title" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="edit_desc" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="edit_priority">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="edit_status">
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary" style="flex: 2;">Update Task</button>
                <a href="/dashboard" class="btn" style="flex: 1; background: #e2e8f0; text-align: center; text-decoration: none; color: black;">Cancel</a>
            </div>
        </form>
    </div>
</div>

<!-- Page specific script to load task data -->
<script src="{{ url_for('static', filename='js/edit_task.js') }}"></script>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/edit_task.js') }}"></script>
{% endblock %}
